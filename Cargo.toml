[package]
name = "blosc2-pure-rs"
version = "0.2.4"
edition = "2021"
description = "Rust implementation of the Blosc2 high-performance compression library"
license = "BSD-3-Clause"
repository = "https://github.com/henriksson-lab/blosc2-rs"
homepage = "https://github.com/henriksson-lab/blosc2-rs"
documentation = "https://docs.rs/blosc2-pure-rs"
readme = "README.md"
keywords = ["compression", "blosc", "lz4", "zstd", "shuffle"]
categories = ["compression", "encoding"]
include = [
    "/src/**/*.rs",
    "/benches/**/*.rs",
    "/docs/**/*.md",
    "/examples/**/*.rs",
    "/tools/bench_against_c_blosc2.py",
    "/tools/bench_real_manifest.delta_regression.toml",
    "/tools/bench_real_manifest.example.toml",
    "/tools/bench_real_manifest.publish_local.toml",
    "/tools/bench_real_manifest.relevant.toml",
    "/tools/c_blosc2_file_bench.c",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.txt",
    # No C sources ship: the crate is pure Rust by default. The vendored c-blosc2/
    # tree is only needed for the internal `_ffi` test feature, sourced from the repo
    # checkout or BLOSC2_C_SOURCE_DIR rather than the published package.
]

[lib]
name = "blosc2_pure_rs"
path = "src/lib.rs"

[[bin]]
name = "blosc2"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = [
    "zlib-rs",
    "plugin-ndlz",
    "plugin-bytedelta",
    "plugin-int-trunc",
    "plugin-ndcell",
    "plugin-ndmean",
    "plugin-zfp",
]
cli = ["dep:clap"]
compare-blosc2-rs = ["dep:blosc2"]
plugin-ndlz = []
plugin-bytedelta = []
plugin-int-trunc = []
plugin-ndcell = []
plugin-ndmean = []
plugin-zfp = ["dep:zfp-rs"]
# Enable flate2's zlib-rs backend. The dependency always keeps rust_backend
# available so cargo check --no-default-features still has a valid backend.
zlib-rs = ["flate2/zlib-rs"]
# Compatibility feature for explicitly selecting the miniz_oxide-backed path.
zlib-miniz = ["flate2/rust_backend"]
# (lz4hc-sys feature removed in v0.2.3 — pure-Rust LZ4HC is always available via lz4-pure-rs.)
# Internal feature for development testing against C-Blosc2. Not part of the
# public API. Uses BLOSC2_C_SOURCE_DIR or repo-local c-blosc2/ as the C source.
_ffi = ["dep:cmake", "dep:bindgen"]

[dependencies]
blosc2 = { package = "blosc2-rs", version = "0.4.0", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rayon = "1"
lz4-pure = { package = "lz4-pure-rs", version = "0.1" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd-pure-rs = { version = "0.1", git = "https://github.com/henriksson-lab/zstd-pure-rs" }
zfp-rs = { version = "0.1.1", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "perf"
harness = false

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "equivalence"
required-features = ["_ffi", "cli"]

[[test]]
name = "codec_equivalence"
required-features = ["_ffi"]

[[test]]
name = "compress_equivalence"
required-features = ["_ffi"]

[[test]]
name = "filter_equivalence"
required-features = ["_ffi"]

[[test]]
name = "tier1_edge_cases"
required-features = ["_ffi"]

[[test]]
name = "tier1_multi_filter"
required-features = ["_ffi"]

[[test]]
name = "tier1_special_values"
required-features = ["_ffi"]

[[test]]
name = "tier2_stress"
required-features = ["_ffi"]

[[test]]
name = "unit_ffi"
required-features = ["_ffi"]

[[test]]
name = "lz4_byte_equal"
required-features = ["_ffi"]

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
cmake = { version = "0.1", optional = true }
bindgen = { version = "0.72", optional = true }

[profile.release-dbg]
inherits = "release"
debug = true

